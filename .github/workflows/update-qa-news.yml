name: Update QA News Data

on:
  schedule:
    # Run daily at 5 AM UTC
    - cron: '0 5 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-qa-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ChiefofStaff
        uses: actions/checkout@v4
        with:
          path: ChiefofStaff
          token: ${{ secrets.QA_NEWS_TOKEN }}

      - name: Checkout QA-News
        uses: actions/checkout@v4
        with:
          repository: rciesielski3/qa-news
          path: qa-news
          token: ${{ secrets.QA_NEWS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ChiefofStaff dependencies
        working-directory: ChiefofStaff
        run: npm ci

      - name: Build ChiefofStaff
        working-directory: ChiefofStaff
        run: npm run build

      - name: Generate QA-News export
        working-directory: ChiefofStaff
        run: |
          npx ts-node src/cli/qa-news-export.ts > ../qa-news-export.json

      - name: Validate JSON
        run: |
          cat ../qa-news-export.json | jq '.' > /dev/null || (echo "Invalid JSON"; exit 1)
          ARTICLE_COUNT=$(cat ../qa-news-export.json | jq '.articles | length')
          echo "Generated export with $ARTICLE_COUNT articles"

      - name: Update QA-News latest.json
        working-directory: qa-news
        run: |
          cp ../qa-news-export.json public/latest.json
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add public/latest.json
          git diff --cached --quiet || git commit -m "data: update latest articles from ChiefofStaff RSS feeds"

      - name: Create Pull Request for QA-News
        working-directory: qa-news
        run: |
          # Check if there are changes to push
          if git diff --cached --quiet && git diff --quiet; then
            echo "No changes to push"
            exit 0
          fi

          BRANCH_NAME="automation/update-latest-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git push -u origin "$BRANCH_NAME"

          # Create PR
          PR_URL=$(gh pr create \
            --title "data: update latest articles from ChiefofStaff RSS feeds" \
            --body "Automated update of latest.json with new articles from ChiefofStaff RSS feeds.

          Generated by: update-qa-news workflow" \
            --base main \
            --head "$BRANCH_NAME" \
            --json url \
            --jq .url)

          PR_NUMBER=$(echo "$PR_URL" | grep -oP 'pull/\K[0-9]+')
          echo "Created PR #$PR_NUMBER"

          # Approve PR using automation PAT
          gh pr review "$PR_NUMBER" --approve || echo "PR approval failed, attempting merge anyway"

          # Auto-merge using squash strategy
          gh pr merge "$PR_NUMBER" --squash --auto || echo "PR merge queued or manual approval needed"
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
