name: Test

on:
  pull_request:
    paths:
      - 'qa-news'
      - 'qa-news/**'
      - 'data/canonical_articles.ndjson'
      - '.github/workflows/test.yml'
  workflow_run:
    workflows: ['Daily Brief']
    types: [completed]
    branches:
      - automation/daily-brief

jobs:
  test:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' && github.event_name == 'workflow_run')
    defaults:
      run:
        working-directory: qa-news
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.event.workflow_run.head_branch }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'qa-news/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./qa-news/coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
