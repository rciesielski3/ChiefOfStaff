name: Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single job: "test" is the required status check on main, and
  # merge-daily-brief.yml gates on this workflow's conclusion.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            qa-news/package-lock.json

      # ChiefofStaff suite (tests/ at the repo root)
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --ci --coverage

      - name: Fail if tests modified tracked files
        run: git diff --exit-code --stat

      # qa-news submodule suite
      - name: Install qa-news dependencies
        working-directory: qa-news
        run: npm ci

      - name: Run qa-news tests
        working-directory: qa-news
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          files: ./qa-news/coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
