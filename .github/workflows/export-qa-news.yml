name: Export QA-News Data

permissions:
  contents: write
  pull-requests: write

# WORKFLOW SYNCHRONIZATION STRATEGY:
# This workflow triggers after Daily Brief completes and commits to main.
#
# Trigger: workflow_run on Daily Brief completion
# Daily Brief now pushes directly to main (no PR step), so export triggers
# immediately after daily-brief completes.
#
# Flow:
# 1. Daily Brief fetches articles and commits to main
# 2. export-qa-news triggered by workflow_run event
# 3. Export reads updated canonical_articles.ndjson from main
# 4. Export updates qa-news repo and syncs to live site
#
# Failure modes:
# - Daily Brief fails: skip export (guarded by event status check)
# - Export fails: operator debugs

on:
  workflow_run:
    workflows: ["Daily Brief"]
    types:
      - completed
  workflow_dispatch:

jobs:
  export-qa-news:
    runs-on: ubuntu-latest
    # Only run when triggered by workflow_run (Daily Brief completion) or manual dispatch
    # Skip runs triggered by accidental push events
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout ChiefofStaff repository
        uses: actions/checkout@v4

      - name: Checkout QA-News repository (separate)
        uses: actions/checkout@v4
        with:
          repository: rciesielski3/qa-news
          token: ${{ secrets.QA_NEWS_TOKEN }}
          path: qa-news

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Export daily brief
        run: |
          set -e
          npx ts-node src/cli/export-daily-brief.ts

      - name: Export latest news
        run: |
          set -e
          npx ts-node src/cli/export-latest-news.ts

      - name: Export weekly highlights
        run: |
          set -e
          npx ts-node src/cli/export-weekly-highlights.ts

      - name: Export monthly recap
        run: |
          set -e
          npx ts-node src/cli/export-monthly-recap.ts

      - name: Validate exports in data directory
        run: |
          set -e

          echo "Validating daily-brief.json in data directory..."
          jq '.' qa-news/data/daily-brief.json > /dev/null || exit 1

          echo "Validating latest-news.json in data directory..."
          jq '.' qa-news/data/latest-news.json > /dev/null || exit 1

          echo "Validating weekly-highlights.json in data directory..."
          jq '.' qa-news/data/weekly-highlights.json > /dev/null || exit 1

          echo "Validating monthly-recap.json in data directory..."
          jq '.' qa-news/data/monthly-recap.json > /dev/null || exit 1

          echo "All JSON files are valid in data directory"
          echo ""

          DAILY_COUNT=$(jq '.items | length' qa-news/data/daily-brief.json)
          LATEST_COUNT=$(jq '.items | length' qa-news/data/latest-news.json)
          WEEKLY_COUNT=$(jq '[.weeks[].items[]] | length' qa-news/data/weekly-highlights.json)
          MONTHLY_COUNT=$(jq '[.months[].items[]] | length' qa-news/data/monthly-recap.json)

          echo "Article counts:"
          echo "  Daily: $DAILY_COUNT articles"
          echo "  Latest: $LATEST_COUNT articles"
          echo "  Weekly: $WEEKLY_COUNT articles"
          echo "  Monthly: $MONTHLY_COUNT articles"

      - name: Commit data updates
        id: commit
        run: |
          cd qa-news
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"

          git add data/daily-brief.json data/latest-news.json data/weekly-highlights.json data/monthly-recap.json \
                  public/daily.json public/latest.json public/weekly.json public/monthly.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "data: update qa-news daily/weekly/monthly exports

          Generated from latest RSS articles:
          - daily-brief.json: Top 10 articles for today
          - latest-news.json: Top 50 articles
          - weekly-highlights.json: All articles grouped by week
          - monthly-recap.json: Top 25 articles per month"

          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: export_pr
        if: steps.commit.outputs.changed == 'true'
        run: |
          cd qa-news

          # Clean up any stale branch/PR from previous runs
          gh pr close automation/export-qa-news --delete-branch 2>/dev/null || true
          git push origin --delete automation/export-qa-news 2>/dev/null || true

          # Create fresh PR on fixed branch (no timestamp)
          git checkout -b automation/export-qa-news
          git push -u origin automation/export-qa-news --force-with-lease

          # Create PR and extract number using gh query
          gh pr create \
            --title "data: update qa-news daily/weekly/monthly exports" \
            --body "Automated QA-News data export from latest RSS articles.

          - daily-brief.json: Top 10 articles for today
          - latest-news.json: Top 50 articles
          - weekly-highlights.json: All articles grouped by week
          - monthly-recap.json: Top 25 articles per month

          Generated by: export-qa-news workflow" \
            --base main \
            --head automation/export-qa-news

          # Query for the PR we just created
          PR_NUMBER=$(gh pr list --head automation/export-qa-news --base main --state open --limit 1 | awk '{print $1}')

          if [ -z "$PR_NUMBER" ] || ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "❌ Failed to create PR"
            exit 1
          fi

          echo "✅ Created PR #$PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.QA_NEWS_TOKEN }}

      - name: Merge export PR
        if: steps.export_pr.outputs.pr_number != ''
        run: |
          PR_NUMBER="${{ steps.export_pr.outputs.pr_number }}"
          echo "Merging QA-News PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --squash --repo rciesielski3/qa-news
        env:
          GH_TOKEN: ${{ secrets.QA_NEWS_TOKEN }}

      - name: Verify PR merge completed
        if: steps.export_pr.outputs.pr_number != ''
        run: |
          PR_NUMBER="${{ steps.export_pr.outputs.pr_number }}"
          echo "Verifying PR #$PR_NUMBER was merged..."
          .github/scripts/wait-for-pr-merge.sh "$PR_NUMBER" 180 rciesielski3/qa-news
        env:
          GH_TOKEN: ${{ secrets.QA_NEWS_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "Export QA-News Data workflow completed"
          echo "Synced files:"
          ls -lh qa-news/data/*.json qa-news/public/latest.json 2>/dev/null || true
