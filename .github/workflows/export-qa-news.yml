name: Export QA-News Data

permissions:
  contents: write
  pull-requests: write

# WORKFLOW SYNCHRONIZATION STRATEGY:
# Export must read canonical_articles.ndjson AFTER the Daily Brief PR is merged to main.
#
# Trigger: workflow_run on "Merge Daily Brief PR" completion (success only)
# Daily Brief commits to automation/daily-brief and opens a PR; the PR is merged
# by merge-daily-brief.yml. Triggering on Daily Brief itself raced the merge:
# export checked out main before the PR landed and published stale data.
#
# Flow:
# 1. Daily Brief fetches articles and opens automation/daily-brief PR
# 2. Test passes on the PR, Merge Daily Brief PR merges it to main
# 3. export-qa-news triggered by that merge workflow's completion
# 4. Export reads canonical_articles.ndjson from main (includes the merged articles)
# 5. Export updates qa-news repo and syncs to live site
#
# Failure modes:
# - Merge step fails: skip export (guarded by conclusion check)
# - Export fails: operator debugs

on:
  workflow_run:
    workflows: ["Merge Daily Brief PR"]
    types:
      - completed
  workflow_dispatch:

jobs:
  export-qa-news:
    runs-on: ubuntu-latest
    # Only run after a successful merge workflow, or on manual dispatch
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout ChiefofStaff repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout QA-News repository (separate)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rciesielski3/qa-news
          token: ${{ secrets.QA_NEWS_TOKEN }}
          path: qa-news

      - name: Setup Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Export daily brief
        run: |
          set -e
          npx ts-node src/cli/export-daily-brief.ts

      - name: Export latest news
        run: |
          set -e
          npx ts-node src/cli/export-latest-news.ts

      # Optional: GitHub trends for the "New & notable repos" section. A failure keeps
      # the previous public/trending.json (the CLI writes atomically, only on success).
      - name: Export GitHub trends
        continue-on-error: true
        run: |
          set -e
          npx ts-node src/cli/export-github-trends.ts --out qa-news/public/trending.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate exports in data directory
        run: |
          set -e

          echo "Validating daily-brief.json in data directory..."
          jq '.' qa-news/data/daily-brief.json > /dev/null || exit 1

          echo "Validating latest-news.json in data directory..."
          jq '.' qa-news/data/latest-news.json > /dev/null || exit 1

          echo "All JSON files are valid in data directory"
          echo ""

          DAILY_COUNT=$(jq '.items | length' qa-news/data/daily-brief.json)
          LATEST_COUNT=$(jq '.items | length' qa-news/data/latest-news.json)

          echo "Article counts:"
          echo "  Daily: $DAILY_COUNT articles"
          echo "  Latest: $LATEST_COUNT articles"

          # Non-fatal: trends are optional and the site hides the section if invalid
          if [ -f qa-news/public/trending.json ]; then
            if jq -e '.items | type == "array"' qa-news/public/trending.json > /dev/null 2>&1; then
              echo "  Trending: $(jq '.items | length' qa-news/public/trending.json) repos"
            else
              echo "::warning::qa-news/public/trending.json is not valid trends JSON"
            fi
          else
            echo "  Trending: no trending.json (skipped)"
          fi

      - name: Commit data updates
        id: commit
        run: |
          cd qa-news
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"

          git add data/daily-brief.json data/latest-news.json \
                  public/daily.json public/latest.json
          # Optional file: only add it if the trends export has produced it
          if [ -f public/trending.json ]; then
            git add public/trending.json
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "data: update qa-news daily/latest exports

          Generated from latest RSS articles:
          - daily-brief.json: Top 10 articles for today
          - latest-news.json: all articles from the last 30 days"

          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: export_pr
        if: steps.commit.outputs.changed == 'true'
        run: |
          cd qa-news

          # Clean up any stale branch/PR from previous runs
          gh pr close automation/export-qa-news --delete-branch 2>/dev/null || true
          git push origin --delete automation/export-qa-news 2>/dev/null || true

          # Create fresh PR on fixed branch (no timestamp)
          git checkout -b automation/export-qa-news
          git push -u origin automation/export-qa-news --force-with-lease

          # Create PR and extract number using gh query
          gh pr create \
            --title "data: update qa-news daily/latest exports" \
            --body "Automated QA-News data export from latest RSS articles.

          - daily-brief.json: Top 10 articles for today
          - latest-news.json: all articles from the last 30 days

          Generated by: export-qa-news workflow" \
            --base main \
            --head automation/export-qa-news

          # Query for the PR we just created
          PR_NUMBER=$(gh pr list --head automation/export-qa-news --base main --state open --limit 1 | awk '{print $1}')

          if [ -z "$PR_NUMBER" ] || ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "❌ Failed to create PR"
            exit 1
          fi

          echo "✅ Created PR #$PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.QA_NEWS_TOKEN }}

      - name: Merge export PR
        if: steps.export_pr.outputs.pr_number != ''
        run: |
          PR_NUMBER="${{ steps.export_pr.outputs.pr_number }}"
          echo "Merging QA-News PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --squash --repo rciesielski3/qa-news
        env:
          GH_TOKEN: ${{ secrets.QA_NEWS_TOKEN }}

      - name: Verify PR merge completed
        if: steps.export_pr.outputs.pr_number != ''
        run: |
          PR_NUMBER="${{ steps.export_pr.outputs.pr_number }}"
          echo "Verifying PR #$PR_NUMBER was merged..."
          .github/scripts/wait-for-pr-merge.sh "$PR_NUMBER" 180 rciesielski3/qa-news
        env:
          GH_TOKEN: ${{ secrets.QA_NEWS_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "Export QA-News Data workflow completed"
          echo "Synced files:"
          ls -lh qa-news/data/*.json qa-news/public/latest.json qa-news/public/trending.json 2>/dev/null || true
