name: Daily Brief Monitoring & Alerts

# Freshness monitor. Failure alerts for Daily Brief / Export runs are handled
# by notify.yml (workflow_run). This workflow catches what notify.yml cannot:
#   A. Daily Brief silently did not run (no successful run in 26h)
#   B. The published QA-News site data is stale (public/latest.json > 30h old)
#   C. data/canonical_articles.ndjson is empty or contains invalid JSON lines
# A failing condition re-alerts on every scheduled run (every 6h) until fixed.

permissions:
  actions: read
  contents: read

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run freshness checks
        id: checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MAX_BRIEF_AGE_HOURS: '26'
          MAX_SITE_AGE_HOURS: '30'
          NDJSON_FILE: data/canonical_articles.ndjson
        run: |
          FAILURES=""
          NOW=$(date -u +%s)

          # Convert an ISO-8601 timestamp (optional fractional seconds) to epoch seconds
          to_epoch() {
            jq -rn --arg t "$1" '$t | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601' 2>/dev/null || true
          }

          # Check A: last successful Daily Brief run
          LAST_OK=$(gh run list --repo "$REPO" --workflow=daily-brief.yml --status success --limit 1 \
            --json updatedAt --jq '.[0].updatedAt // empty' || true)
          LAST_OK_EPOCH=$(to_epoch "$LAST_OK")
          if [ -z "$LAST_OK_EPOCH" ]; then
            FAILURES="${FAILURES}- Daily Brief: no successful run found\n"
          else
            AGE_H=$(( (NOW - LAST_OK_EPOCH) / 3600 ))
            echo "Check A: last successful Daily Brief at $LAST_OK (${AGE_H}h ago)"
            if [ "$AGE_H" -ge "$MAX_BRIEF_AGE_HOURS" ]; then
              FAILURES="${FAILURES}- Daily Brief: last success ${AGE_H}h ago (limit ${MAX_BRIEF_AGE_HOURS}h)\n"
            fi
          fi

          # Check B: published site data freshness (updatedAt written at export time,
          # falling back to the last commit touching the file)
          SITE_TS=$(gh api repos/rciesielski3/qa-news/contents/public/latest.json --jq '.content' 2>/dev/null \
            | base64 -d 2>/dev/null | jq -r '.updatedAt // empty' 2>/dev/null || true)
          SITE_SRC="updatedAt"
          if [ -z "$(to_epoch "$SITE_TS")" ]; then
            SITE_TS=$(gh api "repos/rciesielski3/qa-news/commits?path=public/latest.json&per_page=1" \
              --jq '.[0].commit.committer.date // empty' 2>/dev/null || true)
            SITE_SRC="last commit"
          fi
          SITE_EPOCH=$(to_epoch "$SITE_TS")
          if [ -z "$SITE_EPOCH" ]; then
            FAILURES="${FAILURES}- QA-News site: could not read public/latest.json timestamp\n"
          else
            AGE_H=$(( (NOW - SITE_EPOCH) / 3600 ))
            echo "Check B: qa-news public/latest.json $SITE_SRC $SITE_TS (${AGE_H}h ago)"
            if [ "$AGE_H" -ge "$MAX_SITE_AGE_HOURS" ]; then
              FAILURES="${FAILURES}- QA-News site data: ${AGE_H}h old (limit ${MAX_SITE_AGE_HOURS}h)\n"
            fi
          fi

          # Check C: NDJSON file non-empty and every line parses as JSON
          if [ ! -s "$NDJSON_FILE" ]; then
            FAILURES="${FAILURES}- ${NDJSON_FILE}: missing or empty\n"
          else
            TOTAL=$(wc -l < "$NDJSON_FILE" | tr -d ' ')
            BAD=0
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              printf '%s' "$line" | jq -e . >/dev/null 2>&1 || BAD=$((BAD + 1))
            done < "$NDJSON_FILE"
            echo "Check C: $NDJSON_FILE has $TOTAL lines, $BAD invalid"
            if [ "$BAD" -gt 0 ]; then
              FAILURES="${FAILURES}- ${NDJSON_FILE}: ${BAD} invalid JSON line(s)\n"
            fi
          fi

          if [ -n "$FAILURES" ]; then
            printf 'Failed checks:\n%b' "$FAILURES"
            {
              echo "failures<<EOF"
              printf '%b' "$FAILURES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "All freshness checks passed"
          fi

      - name: Send Telegram alert
        if: steps.checks.outputs.failures != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAILURES: ${{ steps.checks.outputs.failures }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Skipping Telegram notification (secrets not configured)"
          else
            TEXT=$(printf 'ChiefOfStaff freshness alert\n%s\n%s' "$FAILURES" "$RUN_URL")
            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TEXT}")
            if echo "$RESPONSE" | jq -e '.ok == true' >/dev/null 2>&1; then
              echo "Telegram alert sent"
            else
              echo "Telegram alert failed: $(echo "$RESPONSE" | jq -r '.description // "Unknown error"')" >&2
            fi
          fi
          echo "::error::Freshness checks failed"
          exit 1
